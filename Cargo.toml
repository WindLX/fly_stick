[package]
name = "fly_stick"
version = "0.1.1"
edition = "2021"
description = "A Python extension for fly stick input device handling"
license = "MIT"
repository = "https://github.com/WindLX/fly_stick"
homepage = "https://github.com/WindLX/fly_stick"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = [
    "cdylib",
]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
evdev = "0.13.2"
log = "0.4.29"
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py39" 把 pyo3 的最小编译 ABI 定在 CPython 3.9；它与 `requires-python >= 3.12`
# 的安装约束相互独立，保留较低的 ABI 下限以获得更宽的 wheel 兼容性。
pyo3 = { version = "0.28.2", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "0.28.0", features = [
    "tokio-runtime",
] }
pyo3-log = "0.13.3"
serde = { version = "1.0.228", features = [
    "derive",
] }
tokio = { version = "1.50.0", features = [
    "full",
] }
toml = "1.1.2"

[dev-dependencies]
tempfile = "3.27.0"
